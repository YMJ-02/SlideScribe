pipeline:
  default_mode: "both"   # both | slides | whisper

slide_detection:
  # 다중 시그널 + 적응형 임계값 (stages/stage1_segment.py 참조)
  frame_sample_rate: 2.0     # 초당 샘플링 프레임 수 (높을수록 더 민감, 더 느림)
  sensitivity: 2.5           # 적응형 임계값 계수 k — 낮을수록 더 많이 감지 (1.5~4.0 권장)
  merge_score: 0.07          # 인접 슬라이드 사후 병합 임계값 — 높을수록 더 많이 병합
  min_slide_sec: 2.0         # 슬라이드 최소 지속 시간 (초) — 짧으면 이웃과 병합
  min_score_floor: 0.08      # 적응형 임계값의 절대 하한 (소음 floor)

  # ── 구버전 호환 (사용되지 않지만 cfg 검증을 위해 남겨둠) ─────────
  slide_change_threshold: 0.90
  ssim_merge_threshold: 0.85

stt:
  model_name: "large-v3"
  device: "cuda"
  compute_type: "float16"
  language: "auto"   # auto | ko | en | ja | zh | fr | de | es | pt | ru
  beam_size: 5
  # 1 = 단일 세그먼트 (안전, 권장). >1 = BatchedInferencePipeline (빠르지만
  # 8GB VRAM 환경에서 멈춤 사례 있음). 충분한 VRAM + 안정적 환경에서만 4~8 사용.
  batch_size: 1
  kospacing: true    # 한국어 띄어쓰기 자동 교정 (감지/선택 언어가 ko일 때)

export:
  format: "html"        # html | pdf | markdown
  embed_images: true    # HTML base64 임베드

paths:
  output_dir: "output"
  tmp_dir: ".tmp"
